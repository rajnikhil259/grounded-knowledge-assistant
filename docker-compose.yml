services:
  # Step 1: only the database. Run: docker compose up -d
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"          # host:container
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Last step: the API in a container. Run: docker compose --profile full up -d --build
  api:
    build: ./backend
    container_name: rag_api
    profiles: ["full"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/ragdb   # inside Docker the host is "db"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
